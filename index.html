<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리의 일본 여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5EEDD;
    --paper-card:#FBF7EC;
    --paper-dark:#EAE0C4;
    --ink:#2E2A24;
    --ink-light:#7A7161;
    --indigo:#2F3E5C;
    --indigo-light:#4C5F85;
    --vermillion:#BF4830;
    --vermillion-light:#D9694E;
    --ume:#C97B92;
    --matcha:#7C8B5C;
    --line:#D8CBAA;
    --shadow: 0 2px 10px rgba(46,42,36,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(46,42,36,0.045) 1px, transparent 0);
    background-size: 18px 18px;
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px; margin:0 auto; padding:28px 20px 80px;}

  /* ---------- Header ---------- */
  header{ text-align:center; margin-bottom:26px; position:relative; }
  .eyebrow{
    font-size:11px; letter-spacing:0.22em; color:var(--vermillion);
    font-weight:600; text-transform:uppercase; margin-bottom:8px;
  }
  h1{
    font-family:'Song Myung', serif;
    font-size:34px; margin:0 0 6px; color:var(--indigo);
    letter-spacing:0.02em;
  }
  .sub{ font-size:13px; color:var(--ink-light); }

  /* ---------- Tabs ---------- */
  nav.tabs{
    display:flex; justify-content:center; gap:6px; margin:24px 0 22px;
    border-bottom:1px solid var(--line);
  }
  nav.tabs button{
    font-family:'Noto Sans KR', sans-serif;
    background:none; border:none; cursor:pointer;
    font-size:14px; font-weight:600; color:var(--ink-light);
    padding:10px 18px; position:relative; letter-spacing:0.02em;
  }
  nav.tabs button.active{ color:var(--indigo); }
  nav.tabs button.active::after{
    content:""; position:absolute; left:14px; right:14px; bottom:-1px; height:2px;
    background:var(--vermillion);
  }

  .panel{ display:none; }
  .panel.active{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Schedule: ticket rail ---------- */
  .rail{
    display:flex; gap:14px; overflow-x:auto; padding:6px 4px 18px;
    scroll-snap-type:x proximity;
  }
  .ticket{
    scroll-snap-align:start;
    flex:0 0 208px;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:var(--shadow);
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  .ticket-head{
    background:var(--indigo);
    color:var(--paper-card);
    padding:12px 14px 14px;
    position:relative;
  }
  .ticket-head .wk{ font-size:11px; opacity:.75; letter-spacing:.14em; }
  .ticket-head .dt{ font-family:'Song Myung', serif; font-size:26px; margin-top:2px; }
  .perf{
    position:relative; height:0; border-top:1px dashed rgba(46,42,36,0.3);
    margin:0 0;
  }
  .perf::before, .perf::after{
    content:""; position:absolute; top:-7px; width:14px; height:14px; border-radius:50%;
    background:var(--paper);
  }
  .perf::before{ left:-7px; }
  .perf::after{ right:-7px; }
  .ticket-body{ padding:12px 12px 14px; flex:1; display:flex; flex-direction:column; gap:8px; }

  .ev{
    background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:8px 9px; position:relative;
  }
  .ev.stay{ background:#EFE9F4; border-color:#DCCFE8; }
  .ev.todo{ background:#FBF1E4; border-color:#EBD9B8; }
  .ev-time{ font-size:11px; font-weight:700; color:var(--vermillion); margin-bottom:2px; }
  .ev.stay .ev-time{ color:var(--ume); }
  .ev.todo .ev-time{ color:var(--matcha); }
  .ev-title[contenteditable]{ outline:none; font-size:13px; font-weight:600; line-height:1.35; }
  .ev-note[contenteditable]{ outline:none; font-size:11.5px; color:var(--ink-light); margin-top:2px; line-height:1.3; }
  .ev-time[contenteditable]{ outline:none; }
  .ev .del{
    position:absolute; top:4px; right:5px; border:none; background:none; cursor:pointer;
    color:var(--ink-light); font-size:12px; opacity:0; transition:opacity .15s;
    width:16px; height:16px; line-height:16px; text-align:center;
  }
  .ev:hover .del{ opacity:.6; }
  .ev .del:hover{ opacity:1; color:var(--vermillion); }

  .add-ev{
    border:1px dashed var(--line); border-radius:8px; padding:7px 9px;
    font-size:12px; color:var(--ink-light); text-align:center; cursor:pointer;
    background:transparent;
  }
  .add-ev:hover{ border-color:var(--indigo-light); color:var(--indigo); }

  .type-row{ display:flex; gap:4px; margin-top:6px; }
  .type-row button{
    flex:1; font-size:10px; padding:5px 0; border-radius:6px; border:1px solid var(--line);
    background:#fff; cursor:pointer; color:var(--ink-light);
  }
  .type-row button.sel{ background:var(--indigo); color:#fff; border-color:var(--indigo); }

  .mini-form{ display:none; flex-direction:column; gap:6px; margin-top:4px; }
  .mini-form.open{ display:flex; }
  .mini-form input{
    font-family:'Noto Sans KR', sans-serif; font-size:12px; padding:6px 8px;
    border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink);
  }
  .mini-form .row{ display:flex; gap:6px; }
  .mini-form .row button{
    font-size:12px; padding:6px 10px; border-radius:6px; border:none; cursor:pointer;
    background:var(--indigo); color:#fff; font-weight:600;
  }
  .mini-form .row button.cancel{ background:transparent; color:var(--ink-light); }

  /* ---------- Section card shell (places / checklist) ---------- */
  .section-title{
    font-family:'Song Myung', serif; font-size:19px; color:var(--indigo); margin:26px 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .section-title .cnt{
    font-family:'Noto Sans KR', sans-serif; font-size:11px; background:var(--paper-dark);
    color:var(--ink-light); padding:2px 8px; border-radius:10px; font-weight:600;
  }
  .empty{
    border:1px dashed var(--line); border-radius:10px; padding:22px; text-align:center;
    color:var(--ink-light); font-size:13px; background:var(--paper-card);
  }

  /* ---------- Places ---------- */
  .place-filter{ display:flex; gap:6px; margin-bottom:14px; }
  .place-filter button{
    font-size:12px; padding:6px 14px; border-radius:16px; border:1px solid var(--line);
    background:var(--paper-card); cursor:pointer; color:var(--ink-light); font-weight:600;
  }
  .place-filter button.sel{ background:var(--vermillion); border-color:var(--vermillion); color:#fff; }

  .paste-row{ display:flex; gap:8px; margin-bottom:6px; }
  .paste-row input{
    flex:1; font-family:'Noto Sans KR', sans-serif; font-size:13px; padding:9px 12px;
    border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);
  }
  .paste-row button{
    font-size:13px; font-weight:700; padding:9px 16px; border-radius:8px; border:none;
    background:var(--indigo); color:#fff; cursor:pointer; white-space:nowrap;
  }
  .paste-row button:hover{ background:var(--indigo-light); }
  .paste-note{ font-size:11.5px; color:var(--ink-light); min-height:16px; margin-bottom:14px; }
  .paste-note.warn{ color:var(--vermillion); }

  .place-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px; }
  .place-card{
    background:var(--paper-card); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); padding:14px; position:relative;
  }
  .place-badge{
    display:inline-block; font-size:10px; font-weight:700; letter-spacing:.04em;
    padding:2px 8px; border-radius:10px; margin-bottom:8px;
  }
  .place-badge.food{ background:#F3E4DD; color:var(--vermillion); }
  .place-badge.stay{ background:#E8E2F1; color:#6C4E8C; }
  .place-badge.spot{ background:#E4EBDA; color:var(--matcha); }
  .place-name[contenteditable]{ outline:none; font-size:15px; font-weight:700; margin-bottom:4px; }
  .place-memo[contenteditable]{ outline:none; font-size:12px; color:var(--ink-light); line-height:1.5; margin-bottom:6px; min-height:16px; }
  .place-addr[contenteditable]{ outline:none; font-size:11.5px; color:var(--ink-light); border-top:1px dashed var(--line); padding-top:6px; margin-bottom:10px; }
  .place-actions{ display:flex; gap:8px; align-items:center; }
  .map-link{
    font-size:11.5px; font-weight:700; color:var(--indigo); text-decoration:none;
    border:1px solid var(--indigo); border-radius:6px; padding:5px 10px; display:inline-flex;
    align-items:center; gap:4px;
  }
  .map-link:hover{ background:var(--indigo); color:#fff; }
  .place-card .del{
    position:absolute; top:10px; right:10px; border:none; background:none; cursor:pointer;
    color:var(--ink-light); font-size:13px; opacity:.4;
  }
  .place-card .del:hover{ opacity:1; color:var(--vermillion); }

  /* ---------- Settlement tab ---------- */
  .rate-card{
    background:var(--indigo); color:var(--paper-card); border-radius:12px;
    padding:16px 18px; margin-bottom:24px; box-shadow:var(--shadow);
  }
  .rate-row{ display:flex; align-items:center; justify-content:space-between; }
  .rate-label{ font-size:12px; opacity:.8; letter-spacing:.03em; }
  .refresh-btn{
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.3); color:#fff;
    font-size:11px; padding:4px 10px; border-radius:14px; cursor:pointer;
  }
  .refresh-btn:hover{ background:rgba(255,255,255,0.22); }
  .rate-value{ font-family:'Song Myung', serif; font-size:26px; margin-top:6px; }
  .rate-updated{ font-size:10.5px; opacity:.65; margin-top:2px; }
  .converter{
    display:flex; align-items:center; gap:10px; margin-top:14px;
    background:rgba(255,255,255,0.1); border-radius:8px; padding:10px 12px;
  }
  .converter input{
    flex:1; min-width:0; font-family:'Noto Sans KR', sans-serif; font-size:14px; padding:6px 8px;
    border:none; border-radius:6px; background:#fff; color:var(--ink);
  }
  .converter .eq{ opacity:.6; }
  .converter .krwResult{ font-weight:700; font-size:15px; white-space:nowrap; }

  .names-row{ font-size:13px; color:var(--ink-light); margin-bottom:12px; }
  .payer-name{ outline:none; font-weight:700; color:var(--ink); border-bottom:1px dashed var(--line); padding:0 2px; }
  .names-sep{ margin:0 6px; }
  .names-hint{ font-size:11px; margin-left:8px; opacity:.7; }

  .exp-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .exp-item{
    display:flex; align-items:center; gap:10px; background:var(--paper-card);
    border:1px solid var(--line); border-radius:8px; padding:9px 12px; position:relative;
  }
  .exp-who{ font-size:11px; font-weight:700; color:var(--indigo); background:#E4E9F1; padding:3px 8px; border-radius:10px; white-space:nowrap; }
  .exp-body{ flex:1; min-width:0; }
  .exp-memo{ font-size:13px; font-weight:600; }
  .exp-date{ font-size:11px; font-weight:500; color:var(--ink-light); }
  .exp-amount{ font-size:12px; color:var(--ink-light); margin-top:1px; }
  .exp-item .del{ border:none; background:none; cursor:pointer; color:var(--ink-light); font-size:13px; opacity:0; }
  .exp-item:hover .del{ opacity:.6; }
  .exp-item .del:hover{ opacity:1; color:var(--vermillion); }

  .exp-form{
    border:1px dashed var(--line); border-radius:10px; padding:12px; display:flex;
    flex-direction:column; gap:8px; margin-bottom:20px;
  }
  .exp-form-row{ display:flex; gap:8px; }
  .exp-form select, .exp-form input{
    font-family:'Noto Sans KR', sans-serif; font-size:13px; padding:8px 10px;
    border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink);
  }
  .exp-form-row select{ flex:0 0 auto; }
  .exp-form-row input{ flex:1; min-width:0; }
  .exp-form-row input#expDate{ flex:0 0 150px; }
  .exp-form > input{ width:100%; }
  .exp-form button{
    font-size:13px; font-weight:700; padding:9px 0; border-radius:8px; border:none;
    background:var(--indigo); color:#fff; cursor:pointer;
  }
  .exp-form button:hover{ background:var(--indigo-light); }

  .settle-summary{
    background:var(--paper-card); border:1px solid var(--line); border-radius:10px;
    padding:16px; text-align:center; font-size:14px; line-height:1.6;
  }
  .settle-summary strong{ color:var(--vermillion); font-family:'Song Myung', serif; font-size:16px; }

  .add-card{
    border:1px dashed var(--line); border-radius:10px; padding:14px; background:transparent;
    cursor:pointer; color:var(--ink-light); font-size:13px; font-weight:600;
    display:flex; align-items:center; justify-content:center; min-height:64px; text-align:center;
  }
  .add-card:hover{ border-color:var(--indigo-light); color:var(--indigo); }

  /* ---------- Checklist ---------- */
  .check-cols{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:640px){ .check-cols{ grid-template-columns:1fr; } }
  .check-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .check-item{
    display:flex; align-items:center; gap:10px; background:var(--paper-card);
    border:1px solid var(--line); border-radius:8px; padding:9px 10px; position:relative;
  }
  .stamp-box{
    flex:0 0 26px; height:26px; border-radius:50%; border:2px solid var(--line);
    cursor:pointer; position:relative; background:#fff;
  }
  .check-item.done .stamp-box{
    border-color:var(--vermillion);
    background:
      radial-gradient(circle, transparent 40%, rgba(191,72,48,0.06) 41%),
      #fff;
  }
  .check-item.done .stamp-box::before{
    content:"完"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Song Myung', serif; font-size:13px; color:var(--vermillion);
    border:1px solid var(--vermillion); border-radius:50%; transform:rotate(-12deg); margin:1px;
  }
  .check-item span[contenteditable]{
    outline:none; font-size:13px; flex:1; line-height:1.4;
  }
  .check-item.done span[contenteditable]{ color:var(--ink-light); text-decoration:line-through; text-decoration-color:var(--line); }
  .check-item .del{
    border:none; background:none; cursor:pointer; color:var(--ink-light); font-size:12px; opacity:0;
  }
  .check-item:hover .del{ opacity:.6; }
  .check-item .del:hover{ opacity:1; color:var(--vermillion); }
  .add-check{
    width:100%; border:1px dashed var(--line); border-radius:8px; padding:8px; background:transparent;
    color:var(--ink-light); font-size:12px; cursor:pointer;
  }
  .add-check:hover{ border-color:var(--indigo-light); color:var(--indigo); }

  .save-note{
    text-align:center; font-size:11px; color:var(--ink-light); margin-top:34px;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--matcha); display:inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">2026.08.24 – 08.29</div>
    <h1>우리의 일본 여행</h1>
    <div class="sub">오사카 · 교토 · 간사이 · 함께 채워가는 여행 다이어리</div>
  </header>

  <nav class="tabs">
    <button data-tab="schedule" class="active">일정</button>
    <button data-tab="places">맛집 · 숙소</button>
    <button data-tab="settlement">정산</button>
    <button data-tab="lists">리스트</button>
  </nav>

  <section id="panel-schedule" class="panel active">
    <div class="rail" id="rail"></div>
  </section>

  <section id="panel-places" class="panel">
    <div class="place-filter" id="placeFilter">
      <button data-f="all" class="sel">전체</button>
      <button data-f="food">맛집</button>
      <button data-f="stay">숙소</button>
      <button data-f="spot">관광명소</button>
    </div>
    <div class="paste-row">
      <input id="mapsPasteInput" placeholder="구글맵 전체 링크 붙여넣기 (예: google.com/maps/place/...)">
      <button id="mapsPasteBtn">불러오기</button>
    </div>
    <div class="paste-note" id="pasteNote"></div>
    <div class="place-grid" id="placeGrid"></div>
  </section>

  <section id="panel-settlement" class="panel">
    <div class="rate-card">
      <div class="rate-row">
        <div class="rate-label">실시간 환율 (JPY → KRW)</div>
        <button id="refreshRateBtn" class="refresh-btn">↻ 새로고침</button>
      </div>
      <div class="rate-value" id="rateValue">불러오는 중…</div>
      <div class="rate-updated" id="rateUpdated"></div>
      <div class="converter">
        <input id="jpyInput" type="number" inputmode="decimal" placeholder="엔화 금액">
        <span class="eq">→</span>
        <div class="krwResult" id="krwResult">0원</div>
      </div>
    </div>

    <div class="section-title">지출 기록 <span class="cnt" id="expCnt">0</span></div>
    <div class="names-row">
      <span contenteditable="true" id="name0" class="payer-name"></span>
      <span class="names-sep">·</span>
      <span contenteditable="true" id="name1" class="payer-name"></span>
      <span class="names-hint">(이름을 눌러서 바꿀 수 있어요)</span>
    </div>

    <div class="exp-list" id="expList"></div>

    <div class="exp-form">
      <div class="exp-form-row">
        <select id="expPayer"></select>
        <select id="expCurrency">
          <option value="JPY">¥ 엔</option>
          <option value="KRW">₩ 원</option>
        </select>
        <input id="expAmount" type="number" inputmode="decimal" placeholder="금액">
      </div>
      <div class="exp-form-row">
        <input id="expDate" type="date">
        <input id="expMemo" placeholder="메모 (예: 저녁 식사)">
      </div>
      <button id="expAddBtn">+ 지출 추가</button>
    </div>

    <div class="settle-summary" id="settleSummary"></div>
  </section>

  <section id="panel-lists" class="panel">
    <div class="section-title">준비물 <span class="cnt" id="prepCnt">0</span></div>
    <div class="check-list" id="prepList"></div>
    <button class="add-check" data-cat="prep">+ 항목 추가</button>

    <div class="section-title">버킷리스트 <span class="cnt" id="bucketCnt">0</span></div>
    <div class="check-list" id="bucketList"></div>
    <button class="add-check" data-cat="bucket">+ 항목 추가</button>

    <div class="section-title">쇼핑리스트 <span class="cnt" id="shoppingCnt">0</span></div>
    <div class="check-list" id="shoppingList"></div>
    <button class="add-check" data-cat="shopping">+ 항목 추가</button>
  </section>

  <div class="save-note" id="saveNote"><span class="dot"></span> 남친과 함께 보는 공유 페이지예요 · 자동 저장됨</div>
</div>

<script type="module">
/* ====== Firebase 연동 (GitHub Pages 등 외부 배포용) ======
   아래 firebaseConfig 값을 본인 Firebase 프로젝트의 설정값으로 바꿔주세요.
   Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹) 에서 확인할 수 있어요. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get as fbGet, set as fbSet } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAnrVodxp8HER6AV9tTuvHkOdH0eoKO-jc",
  authDomain: "japan-trip-bf64f.firebaseapp.com",
  databaseURL: "https://japan-trip-bf64f-default-rtdb.firebaseio.com",
  projectId: "japan-trip-bf64f",
  storageBucket: "japan-trip-bf64f.firebasestorage.app",
  messagingSenderId: "378185647978",
  appId: "1:378185647978:web:421fa233428d109bd74713"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

// 기존 코드가 쓰던 window.storage.get/set과 동일한 형태로 동작하는 대체 저장소
window.storage = {
  async get(key, shared){
    const snap = await fbGet(ref(db, key));
    if(!snap.exists()) return null;
    return { key, value: snap.val(), shared: !!shared };
  },
  async set(key, value, shared){
    await fbSet(ref(db, key), value);
    return { key, value, shared: !!shared };
  }
};
/* ====== Firebase 연동 끝 ====== */

const STORAGE_KEY = "japan-trip-2026";

const DEFAULT_STATE = {

function parseGoogleMapsUrl(raw){
  const url = raw.trim();
  const isShort = /goo\.gl|maps\.app\.goo\.gl/i.test(url);
  let name = '', addr = '';
  const nameMatch = url.match(/\/maps\/place\/([^\/@]+)/);
  if(nameMatch){
    try{ name = decodeURIComponent(nameMatch[1].replace(/\+/g,' ')); }catch(e){ name = nameMatch[1].replace(/\+/g,' '); }
  }
  const coordMatch = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(coordMatch){ addr = `${coordMatch[1]}, ${coordMatch[2]}`; }
  return { name, addr, isShort, found: !!(name || addr) };
}

/* ---------------- Settlement ---------------- */
let liveRate = null;

async function fetchRate(){
  try{
    const res = await fetch('https://api.frankfurter.dev/v2/rate/JPY/KRW');
    const data = await res.json();
    if(data && typeof data.rate === 'number') return data.rate;
  }catch(e){ /* try fallback */ }
  try{
    const res2 = await fetch('https://open.er-api.com/v6/latest/JPY');
    const data2 = await res2.json();
    if(data2 && data2.rates && typeof data2.rates.KRW === 'number') return data2.rates.KRW;
  }catch(e){ /* both failed */ }
  return null;
}

function fmtKRW(n){
  return Math.round(n).toLocaleString('ko-KR') + '원';
}
function formatDateLabel(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return '';
  return `${d.getMonth()+1}.${d.getDate()}`;
}

function currentRate(){
  return liveRate ?? state.settlement.lastRate;
}

function toKRW(exp){
  if(exp.currency === 'KRW') return exp.amount;
  const r = currentRate();
  return r ? exp.amount * r : 0;
}

async function initRate(){
  const rateValueEl = document.getElementById('rateValue');
  const rateUpdatedEl = document.getElementById('rateUpdated');
  rateValueEl.textContent = '불러오는 중…';
  const r = await fetchRate();
  if(r){
    liveRate = r;
    state.settlement.lastRate = r;
    state.settlement.lastRateTime = new Date().toISOString();
    saveState();
    rateValueEl.textContent = `100¥ ≈ ${Math.round(r*100).toLocaleString('ko-KR')}원`;
    rateUpdatedEl.textContent = '방금 갱신됨';
  } else if(state.settlement.lastRate){
    liveRate = state.settlement.lastRate;
    rateValueEl.textContent = `100¥ ≈ ${Math.round(liveRate*100).toLocaleString('ko-KR')}원`;
    const t = state.settlement.lastRateTime ? new Date(state.settlement.lastRateTime) : null;
    rateUpdatedEl.textContent = t ? `${t.toLocaleString('ko-KR')} 기준 (갱신 실패, 이전 값 표시)` : '갱신 실패';
  } else {
    rateValueEl.textContent = '환율을 불러오지 못했어요';
    rateUpdatedEl.textContent = '네트워크를 확인하고 새로고침을 눌러주세요';
  }
  updateConverter();
  renderExpenses();
  renderSettleSummary();
}

function updateConverter(){
  const jpy = parseFloat(document.getElementById('jpyInput').value);
  const r = currentRate();
  const out = document.getElementById('krwResult');
  if(!jpy || !r){ out.textContent = '0원'; return; }
  out.textContent = fmtKRW(jpy * r);
}

function renderSettleSummary(){
  const el = document.getElementById('settleSummary');
  const exps = state.settlement.expenses;
  const names = state.settlement.names;
  if(exps.length === 0){
    el.innerHTML = '아직 지출 기록이 없어서 정산할 내역이 없어요.';
    return;
  }
  const totals = [0, 0];
  exps.forEach(exp=>{ totals[exp.payer] += toKRW(exp); });
  const grandTotal = totals[0] + totals[1];
  const perPerson = grandTotal / 2;
  const diff = totals[0] - totals[1]; // positive: 0 paid more
  if(Math.abs(diff) < 1){
    el.innerHTML = `총 지출 <strong>${fmtKRW(grandTotal)}</strong> · 정확히 반반이에요. 정산할 금액이 없어요.`;
    return;
  }
  const oweIdx = diff > 0 ? 1 : 0;
  const receiveIdx = diff > 0 ? 0 : 1;
  const amount = Math.abs(diff) / 2;
  el.innerHTML = `
    총 지출 <strong>${fmtKRW(grandTotal)}</strong> (1인당 ${fmtKRW(perPerson)})<br>
    <strong>${escapeHTML(names[oweIdx])}</strong>가 <strong>${escapeHTML(names[receiveIdx])}</strong>에게
    <strong>${fmtKRW(amount)}</strong> 보내면 정산 끝!
  `;
}

function pad(n){ return String(n).padStart(2,'0'); }
function normalizeSingle(raw){
  let s = (raw||'').trim();
  if(!s) return s;
  if(/^\d{1,2}:\d{2}$/.test(s)){
    const [h,m] = s.split(':');
    return pad(h) + ':' + pad(m);
  }
  const pm = /오후|PM|pm/.test(s);
  const am = /오전|AM|am/.test(s);
  s = s.replace(/오전|오후|AM|PM|am|pm/g,'').trim();
  let m = s.match(/(\d{1,2})\s*[:시]\s*(\d{1,2})?\s*분?/);
  if(m){
    let h = parseInt(m[1],10);
    let min = m[2] ? parseInt(m[2],10) : 0;
    if(pm && h < 12) h += 12;
    if(am && h === 12) h = 0;
    return pad(h) + ':' + pad(min);
  }
  if(/^\d{1,2}$/.test(s)){
    let h = parseInt(s,10);
    if(pm && h < 12) h += 12;
    if(am && h === 12) h = 0;
    return pad(h) + ':00';
  }
  return raw.trim();
}
function normalizeTime(raw){
  if(!raw) return raw;
  const parts = raw.split(/[–\-~]/).map(x=>x.trim()).filter(Boolean);
  if(parts.length >= 2) return parts.map(normalizeSingle).join('–');
  return normalizeSingle(raw);
}

function escapeHTML(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderAll(){
  renderRail();
  renderPlaces();
  renderNames();
  renderExpenses();
  renderSettleSummary();
  renderChecklist();
  initRate();
}

loadState();
